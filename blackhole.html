<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black hole</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#000;
    overflow:hidden;
  }
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #hole{
    display:block;
    image-rendering:auto;
    filter:blur(3px);
    opacity:0;transition:opacity 1.1s ease;
    will-change:filter;
    transform:rotate(105deg) translateZ(0);
  }
  #halo{
    position:absolute;width:96vmin;height:96vmin;border-radius:50%;
    background:radial-gradient(circle, rgba(255,106,31,.13) 0%, rgba(255,106,31,0) 68%);
    pointer-events:none;
  }
  /* A full-screen canvas with no way out is a dead end. Faint enough not to
     compete with the visual, solid on hover for anyone looking for the exit. */
  #back{
    position:fixed;top:22px;left:24px;z-index:2;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:13px;letter-spacing:.01em;
    color:rgba(255,255,255,.34);
    text-decoration:none;
    transition:color .25s ease;
  }
  #back:hover{color:rgba(255,255,255,.92)}

</style>
</head>
<body>
<a id="back" href="index.html">&larr; feras aldawsari</a>
<div id="wrap">
  <div id="halo"></div>
  <canvas id="hole" width="360" height="360"></canvas>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- constants (G = c = M = 1, horizon at r = 2) ---------------- */
  var NB   = 360, HW = NB >> 1;
  var DIST = 55;                       /* camera distance, in M            */
  var INC  = 28 * Math.PI / 180;       /* from the disk normal             */
  var TANH = 0.40;                     /* half field of view               */
  var RIN  = 6.0, ROUT = 16.0;         /* ISCO to outer edge               */
  var OMS  = 1;                        /* rotation sense                   */
  var TS   = 8.0;                      /* seconds to geometric time        */
  var TT   = 160.0;                     /* turbulence refresh, seconds      */
  var STEP = 0.03, MAXS = 900;
  var ATTEN = [1.0, 0.62, 0.34];       /* higher order images are dimmer   */

  var cvs = document.getElementById('hole');
  var ctx = cvs.getContext('2d');
  var img = ctx.createImageData(NB, NB);

  var NR = NB * HW;
  var hn  = new Uint8Array(NR);
  var hr  = new Float32Array(NR * 3);
  var hp  = new Float32Array(NR * 3);
  var hb  = new Float32Array(NR * 3);
  var hbm = new Float32Array(NR * 3);

  /* camera basis */
  var sx = Math.sin(INC), cz = Math.cos(INC);
  var e1x = sx, e1z = cz;                              /* camPos direction */
  var fx = -sx, fz = -cz;                              /* forward          */
  var rgx = 0, rgy = 1, rgz = 0;                       /* screen right = +y */
  var upx = -cz, upz = sx;                             /* screen up        */

  /* ---------------- colour ramp ---------------- */
  var LUT = new Uint8Array(256 * 3);
  (function(){
    var stops = [
      [0.00,   0,  0,  0], [0.08,  22,  4,  1], [0.20,  92, 17,  3],
      [0.38, 173, 51,  5], [0.56, 232,111, 17], [0.74, 255,176, 74],
      [0.89, 255,219,150], [1.00, 255,246,224]
    ];
    for (var i = 0; i < 256; i++){
      var v = i / 255, k = 1;
      while (k < stops.length - 1 && v > stops[k][0]) k++;
      var a = stops[k-1], b = stops[k], f = (v - a[0]) / (b[0] - a[0]);
      LUT[i*3]   = a[1] + (b[1]-a[1]) * f;
      LUT[i*3+1] = a[2] + (b[2]-a[2]) * f;
      LUT[i*3+2] = a[3] + (b[3]-a[3]) * f;
    }
  })();

  /* ---------------- disk emissivity, in the fluid frame ---------------- */
  function tex(r, ph, o){
    var L = Math.log(r);
    var s = 0.66
      + 0.22 * Math.sin(2 * ph +  5.5 * L + o)
      + 0.16 * Math.sin(5 * ph -  8.5 * L + 1.7 + o * 1.7)
      + 0.11 * Math.sin(3 * ph + 15.0 * L + 4.0 + o * 2.3)
      + 0.10 * Math.sin(9 * ph +  3.5 * L + 2.2 + o)
      + 0.08 * Math.sin(ph + 0.8);
    return s < 0.25 ? 0.25 : s;
  }

  /* two shearing layers, crossfaded, so the flow never winds itself to noise */
  function emis(r, psi, tt){
    var x = (r - RIN) / (ROUT - RIN);
    if (x < 0 || x > 1) return 0;
    var rad = (1 - Math.exp(-x * 14)) * Math.exp(-x * 3.2);
    var om = OMS / (r * Math.sqrt(r));
    var aA = tt % TT, aB = (tt + TT / 2) % TT;
    var wA = 0.5 - 0.5 * Math.cos(6.2831853 * aA / TT);
    return rad * 3.0 * (wA * tex(r, psi - om * aA, 0) + (1 - wA) * tex(r, psi - om * aB, 2.4));
  }

  /* ---------------- trace one ray ---------------- */
  function traceRow(row){
    var yn = 1 - 2 * (row + 0.5) / NB;
    for (var col = 0; col < HW; col++){
      var xn = 2 * (col + 0.5) / NB - 1;

      var dx = fx + xn * TANH * rgx + yn * TANH * upx;
      var dy =      xn * TANH * rgy;
      var dz = fz + xn * TANH * rgz + yn * TANH * upz;
      var dl = Math.sqrt(dx*dx + dy*dy + dz*dz);
      dx /= dl; dy /= dl; dz /= dl;

      /* orbital plane: n = camPos x d */
      var nx = -cz * dy;
      var ny =  cz * dx - sx * dz;
      var nz =  sx * dy;
      var nl = Math.sqrt(nx*nx + ny*ny + nz*nz);
      var idx = row * HW + col;
      if (nl < 1e-9){ hn[idx] = 0; continue; }
      nx /= nl; ny /= nl; nz /= nl;

      /* e2 = n x e1 */
      var e2x = ny * e1z;
      var e2y = nz * e1x - nx * e1z;
      var e2z = -ny * e1x;
      var el = Math.sqrt(e2x*e2x + e2y*e2y + e2z*e2z);
      e2x /= el; e2y /= el; e2z /= el;

      var cps = dx * e1x + dz * e1z;
      var sps = dx * e2x + dy * e2y + dz * e2z;
      if (sps < 1e-7){ hn[idx] = 0; continue; }

      var u = 1 / DIST, up = -u * cps / sps, phi = 0;

      /* disk crossings: e1z cos(phi) + e2z sin(phi) = 0 */
      var pc = Math.atan2(-e1z, e2z);
      while (pc <= 0.0001) pc += Math.PI;

      var count = 0;
      for (var s = 0; s < MAXS; s++){
        var pu = u, pup = up, pphi = phi;

        /* RK4 on u'' = -u + 3u^2 */
        var k1u = up,                k1v = -pu + 3*pu*pu;
        var a_u = pu + 0.5*STEP*k1u, a_v = pup + 0.5*STEP*k1v;
        var k2u = a_v,               k2v = -a_u + 3*a_u*a_u;
        var b_u = pu + 0.5*STEP*k2u, b_v = pup + 0.5*STEP*k2v;
        var k3u = b_v,               k3v = -b_u + 3*b_u*b_u;
        var c_u = pu + STEP*k3u,     c_v = pup + STEP*k3v;
        var k4u = c_v,               k4v = -c_u + 3*c_u*c_u;

        u   = pu  + STEP/6 * (k1u + 2*k2u + 2*k3u + k4u);
        up  = pup + STEP/6 * (k1v + 2*k2v + 2*k3v + k4v);
        phi = pphi + STEP;

        if (u > 0.4995 || !isFinite(u)) break;          /* swallowed */

        while (phi >= pc && count < 3){
          var f = (pc - pphi) / STEP;
          var uc = pu + (u - pu) * f;
          var vc = pup + (up - pup) * f;
          pc += Math.PI;
          if (uc <= 0) continue;
          var r = 1 / uc;
          if (r < RIN || r > ROUT) continue;

          var cc = Math.cos(pc - Math.PI), ss = Math.sin(pc - Math.PI);
          var Px = r * (e1x * cc + e2x * ss);
          var Py = r * (        e2y * ss);
          var psi = Math.atan2(Py, Px);

          var drdp = -vc / (uc * uc);
          var Tx = drdp * (e1x*cc + e2x*ss) + r * (-e1x*ss + e2x*cc);
          var Ty = drdp * (        e2y*ss) + r * (          e2y*cc);
          var Tl = Math.sqrt(Tx*Tx + Ty*Ty + Math.pow(drdp*(e1z*cc+e2z*ss) + r*(-e1z*ss+e2z*cc), 2));
          if (Tl < 1e-9) continue;

          var sp = Math.sin(psi), cp = Math.cos(psi);
          var kphi = -(Tx * -sp + Ty * cp) / Tl;        /* toward the observer */

          var v = Math.sqrt(1 / (r - 2));
          var gam = 1 / Math.sqrt(1 - v*v);
          var grav = Math.sqrt(1 - 2 / r);
          var vp = OMS * v;

          var g1 = grav / (gam * (1 - vp * kphi));
          var g2 = grav / (gam * (1 + vp * kphi));      /* mirrored pixel */
          var b1 = g1*g1*g1, b2 = g2*g2*g2;
          if (b1 > 14) b1 = 14;
          if (b2 > 14) b2 = 14;

          var o = idx * 3 + count;
          hr[o]  = r;
          hp[o]  = psi;
          hb[o]  = b1 * ATTEN[count];
          hbm[o] = b2 * ATTEN[count];
          count++;
        }
        if (count >= 3) break;
        if (u < 1 / 70 && up < 0) break;                /* escaped */
      }
      hn[idx] = count;
    }
  }

  /* ---------------- frame ---------------- */
  var t = 0, last = 0, raf = 0, ready = false;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render(){
    var d = img.data, p = 0;
    for (var row = 0; row < NB; row++){
      var base = row * HW;
      for (var col = 0; col < NB; col++){
        var mir = col >= HW;
        var idx = base + (mir ? (NB - 1 - col) : col);
        var n = hn[idx], acc = 0;
        for (var k = 0; k < n; k++){
          var o = idx * 3 + k;
          var ps = mir ? -hp[o] : hp[o];
          var e = emis(hr[o], ps, t);
          if (e > 0) acc += e * (mir ? hbm[o] : hb[o]);
        }
        var v = acc > 0 ? 1 - Math.exp(-1.7 * acc) : 0;
        var ci = (v * 255) | 0;
        if (ci > 255) ci = 255;
        ci *= 3;
        d[p]   = LUT[ci];
        d[p+1] = LUT[ci+1];
        d[p+2] = LUT[ci+2];
        d[p+3] = 255;
        p += 4;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduced) t += dt * TS;
    render();
    raf = requestAnimationFrame(frame);
  }

  /* ---------------- layout and beam ---------------- */
  var size = 0;
  function layout(){
    var w = window.innerWidth, h = window.innerHeight;
    size = Math.min(w * 0.92, h * 0.92);
    cvs.style.width = size + 'px';
    cvs.style.height = size + 'px';
    applyBeam();
  }
  function applyBeam(){
    cvs.style.filter = 'blur(' + (0.005 * size).toFixed(2) + 'px)';
  }
  window.addEventListener('resize', layout);

  /* ---------------- boot: trace in chunks so the page stays alive ------------- */
  var row = 0;
  function chunk(){
    var end = Math.min(NB, row + 18);
    for (; row < end; row++) traceRow(row);
    if (row < NB){ requestAnimationFrame(chunk); return; }
    ready = true;
    cvs.style.opacity = '1';
    last = performance.now();
    if (reduced) render(); else raf = requestAnimationFrame(frame);
  }

  layout();
  requestAnimationFrame(chunk);
})();
</script>
</body>
</html>
